<p>Dobrý den,</p>
<p>Platba za fakturu <strong>{{ model.invoice_number | html.escape }}</strong> byla přijata.</p>
<ul>
  <li><strong>Částka:</strong> {{ model.total }} {{ model.currency }}</li>
  <li><strong>Zaplaceno dne:</strong> {{ model.paid_at | to_user_time | date.to_string "%d.%m.%Y v %H:%M" }}</li>
</ul>

<p style="text-align: center; margin: 32px 0;">
  <a href="{{ app.base_url }}/invoices/{{ model.invoice_id }}" class="btn">Zobrazit potvrzení</a>
</p>
