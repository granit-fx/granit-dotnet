<p>Merhaba,</p>
<p><strong>{{ model.invoice_number | html.escape }}</strong> numaralı fatura için ödeme alındı.</p>
<ul>
  <li><strong>Tutar:</strong> {{ model.total }} {{ model.currency }}</li>
  <li><strong>Ödeme tarihi:</strong> {{ model.paid_at | to_user_time | date.to_string "%d.%m.%Y saat %H:%M" }}</li>
</ul>
<p>Ödemeniz için teşekkür ederiz.</p>
<p style="text-align: center; margin: 32px 0;">
  <a href="{{ app.base_url }}/invoices/{{ model.invoice_id }}" class="btn">Makbuzu görüntüle</a>
</p>
