<p>您好，</p>
<p>已收到发票 <strong>{{ model.invoice_number | html.escape }}</strong> 的付款。</p>
<ul>
  <li><strong>金额：</strong>{{ model.total }} {{ model.currency }}</li>
  <li><strong>付款日期：</strong>{{ model.paid_at | to_user_time | date.to_string "%Y年%m月%d日 %H:%M" }}</li>
</ul>
<p>感谢您的付款。</p>
<p style="text-align: center; margin: 32px 0;">
  <a href="{{ app.base_url }}/invoices/{{ model.invoice_id }}" style="display: inline-block; padding: 12px 28px; background-color: #1d4ed8; color: #ffffff; text-decoration: none; border-radius: 6px; font-size: 15px; font-weight: bold;">查看收据</a>
</p>
