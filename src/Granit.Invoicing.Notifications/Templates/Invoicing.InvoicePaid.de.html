<p>Hallo,</p>
<p>Zahlung für Rechnung <strong>{{ model.invoice_number | html.escape }}</strong> erhalten.</p>
<ul>
  <li><strong>Betrag:</strong> {{ model.total }} {{ model.currency }}</li>
  <li><strong>Bezahlt am:</strong> {{ model.paid_at | to_user_time | date.to_string "%d.%m.%Y um %H:%M" }}</li>
</ul>
<p>Vielen Dank für Ihre Zahlung.</p>
<p style="text-align: center; margin: 32px 0;">
  <a href="{{ app.base_url }}/invoices/{{ model.invoice_id }}" class="btn">Beleg anzeigen</a>
</p>
