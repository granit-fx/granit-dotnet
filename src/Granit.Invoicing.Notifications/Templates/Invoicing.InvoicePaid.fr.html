<p>Bonjour,</p>
<p>Paiement reçu pour la facture <strong>{{ model.invoice_number | html.escape }}</strong>.</p>
<ul>
  <li><strong>Montant :</strong> {{ model.total }} {{ model.currency }}</li>
  <li><strong>Payée le :</strong> {{ model.paid_at | to_user_time | date.to_string "%d/%m/%Y à %H:%M" }}</li>
</ul>
<p>Merci pour votre paiement.</p>
<p style="text-align: center; margin: 32px 0;">
  <a href="{{ app.base_url }}/invoices/{{ model.invoice_id }}" class="btn">Voir le reçu</a>
</p>
