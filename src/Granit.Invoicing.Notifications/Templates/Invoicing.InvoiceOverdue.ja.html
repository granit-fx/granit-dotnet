<p>こんにちは、</p>
<p>請求書 <strong>{{ model.invoice_number | html.escape }}</strong> の支払期限が過ぎています。</p>
<ul>
  <li><strong>未払い金額：</strong>{{ model.amount_remaining }} {{ model.currency }}</li>
  <li><strong>支払期限：</strong>{{ model.due_at | to_user_time | date.to_string "%Y年%m月%d日 %H:%M" }}</li>
  <li><strong>延滞日数：</strong>{{ model.days_overdue }}</li>
</ul>
<p>サービスの中断を避けるため、未払い残高をお支払いください。</p>
<p style="text-align: center; margin: 32px 0;">
  <a href="{{ app.base_url }}/invoices/{{ model.invoice_id }}" style="display: inline-block; padding: 12px 28px; background-color: #1d4ed8; color: #ffffff; text-decoration: none; border-radius: 6px; font-size: 15px; font-weight: bold;">今すぐ支払う</a>
</p>
