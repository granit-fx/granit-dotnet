<title>आपका SSL/TLS प्रमाणपत्र सक्रिय है</title>

<p><strong>{{ model.host }}</strong> के लिए आपका SSL/TLS प्रमाणपत्र जारी कर दिया गया है और अब सक्रिय है।</p>

{{ end }}
<p>Hostname ID: <code>{{ model.hostname_id }}</code></p>
