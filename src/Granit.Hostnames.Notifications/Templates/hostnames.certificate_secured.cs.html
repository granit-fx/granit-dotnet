<title>Váš certifikát SSL/TLS je aktivní</title>
<p>Dobrý den,</p>
<p>Váš certifikát SSL/TLS pro <strong>{{ model.host }}</strong> byl vydán a je nyní aktivní.</p>

<p>Certifikát je platný do <strong>{{ model.expires_at | date.to_string '%d. %B %Y v %H:%M UTC' }}</strong>.</p>

<p>Hostname ID: <code>{{ model.hostname_id }}</code></p>
