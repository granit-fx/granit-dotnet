<title>Su contraseña ha sido cambiada</title>
<p>Hola,</p>
<p>La contraseña de su cuenta <strong>{{ model.email | html.escape }}</strong> ha sido modificada.</p>
<p>Si usted realizó este cambio, no es necesaria ninguna acción adicional.</p>
<p><strong>Si no ha cambiado su contraseña</strong>, su cuenta podría estar comprometida. Restablezca su contraseña inmediatamente y contacte con el soporte.</p>
