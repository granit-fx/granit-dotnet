<p>안녕하세요,</p>
{{- if model.enabled }}
<p>계정 <strong>{{ model.email | html.escape }}</strong>에서 이중 인증이 <strong>활성화</strong>되었습니다.</p>
<p>계정이 더욱 안전해졌습니다. 로그인 시 인증 코드를 입력해야 합니다.</p>
{{- else }}
<p>계정 <strong>{{ model.email | html.escape }}</strong>에서 이중 인증이 <strong>비활성화</strong>되었습니다.</p>
<p><strong>이 변경을 직접 하지 않으셨다면</strong> 계정이 도용되었을 수 있습니다. 즉시 이중 인증을 다시 활성화하고 비밀번호를 재설정해 주세요.</p>
{{- end }}
