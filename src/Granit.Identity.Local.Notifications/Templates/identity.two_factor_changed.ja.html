<title>二要素認証の更新</title>
<p>こんにちは、</p>
{{- if model.enabled }}
<p>アカウント <strong>{{ model.email | html.escape }}</strong> で二要素認証が<strong>有効</strong>になりました。</p>
<p>アカウントのセキュリティが強化されました。ログイン時に確認コードの入力が求められます。</p>
{{- else }}
<p>アカウント <strong>{{ model.email | html.escape }}</strong> で二要素認証が<strong>無効</strong>になりました。</p>
<p><strong>この変更を行っていない場合</strong>、アカウントが不正アクセスを受けている可能性があります。直ちに二要素認証を再度有効にし、パスワードをリセットしてください。</p>
{{- end }}
