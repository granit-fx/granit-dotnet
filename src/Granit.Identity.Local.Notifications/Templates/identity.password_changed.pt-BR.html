<title>Sua senha foi alterada</title>
<p>Olá,</p>
<p>A senha da sua conta <strong>{{ model.email | html.escape }}</strong> foi alterada.</p>
<p>Se foi você quem fez essa alteração, nenhuma ação adicional é necessária.</p>
<p><strong>Se você não alterou sua senha</strong>, sua conta pode estar comprometida. Redefina sua senha imediatamente e entre em contato com o suporte.</p>
