<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="facet1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a4a4a"/>
      <stop offset="100%" style="stop-color:#2d2d2d"/>
    </linearGradient>
    <linearGradient id="facet2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5c5c5c"/>
      <stop offset="100%" style="stop-color:#3a3a3a"/>
    </linearGradient>
    <linearGradient id="facet3" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#0f0f0f"/>
    </linearGradient>
    <linearGradient id="facet4" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2a2a2a"/>
      <stop offset="100%" style="stop-color:#1e1e1e"/>
    </linearGradient>
    <linearGradient id="highlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6e6e6e"/>
      <stop offset="100%" style="stop-color:#4a4a4a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="16" fill="#f0f0f0"/>

  <!-- Stone shape — centered -->
  <g transform="translate(64, 60)">
    <!-- Left face -->
    <polygon points="0,-45 -35,-12 -25,29 0,8" fill="url(#facet3)"/>
    <!-- Right face -->
    <polygon points="0,-45 35,-12 25,29 0,8" fill="url(#facet4)"/>
    <!-- Bottom-left face -->
    <polygon points="-25,29 0,8 0,42 -17,42" fill="url(#facet1)"/>
    <!-- Bottom-right face -->
    <polygon points="25,29 0,8 0,42 17,42" fill="#1a1a1a"/>
    <!-- Top-left highlight facet -->
    <polygon points="0,-45 -17,-29 -8,-8 0,-17" fill="url(#highlight)" opacity="0.7"/>
    <!-- Small diamond highlight -->
    <polygon points="-15,-17 -7,-8 -10,4 -23,0" fill="url(#facet2)" opacity="0.5"/>
    <!-- Top edge highlight -->
    <polygon points="0,-45 -7,-33 7,-33" fill="#7a7a7a" opacity="0.3"/>
  </g>
</svg>