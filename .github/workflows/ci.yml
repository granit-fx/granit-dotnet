# =============================================================================
# GitHub Actions CI/CD - Granit
# =============================================================================
# Pipeline: build+test → security → analysis → pack → publish → deploy
#
# Each job builds independently from NuGet cache (~10s restore).
# No artifact sharing for bin/obj — avoids 750 MB upload/download overhead.
#
# Required secrets:
#   NUGET_API_KEY       — nuget.org API key (for publish on tag)
#
# Optional secrets:
#   SONAR_TOKEN         — SonarCloud authentication token
# =============================================================================

name: CI

on:
  push:
    branches: [develop, main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default all permissions to read — each job declares write only where needed.
# Required by OpenSSF Scorecard: Token-Permissions check.
permissions: read-all

env:
  DOTNET_VERSION: "10.0.x"
  CONFIGURATION: Release
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # ---------------------------------------------------------------------------
  # BUILD + FORMAT CHECK (shared gate — fails fast before tests)
  # ---------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: NuGet cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build (src only)
        run: >
          dotnet build .github/shard-filters/src-only.slnf
          -c $CONFIGURATION -m:4
          -p:GenerateDocumentationFile=false

      - name: Check formatting (src only)
        run: dotnet format .github/shard-filters/src-only.slnf --verify-no-changes --no-restore

  # ---------------------------------------------------------------------------
  # UNIT TESTS — 6 parallel shards aligned with architecture layers
  # Shard definitions: .github/test-shards.json
  # Solution filters: .github/shard-filters/*.slnf (auto-generated)
  # ---------------------------------------------------------------------------
  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: core-ai
            label: "Core + AI"
          - name: business
            label: "Business Features"
          - name: api-data
            label: "API & Http + Data"
          - name: infrastructure
            label: "Infrastructure"
          - name: security
            label: "Security & Compliance"
          - name: architecture
            label: "Architecture Tests"
    name: test (${{ matrix.shard.label }})
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: NuGet cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build shard
        run: >
          dotnet build .github/shard-filters/${{ matrix.shard.name }}.slnf
          -c $CONFIGURATION -m:4
          -p:RunAnalyzers=false
          -p:EnforceCodeStyleInBuild=false

      - name: Run unit tests
        run: >
          dotnet test .github/shard-filters/${{ matrix.shard.name }}.slnf
          -c $CONFIGURATION --no-build
          --logger "trx;LogFilePath=TestResults/results.trx"
          --collect:"XPlat Code Coverage"
          -- RunConfiguration.MaxCpuCount=4
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover,cobertura

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: test-results-${{ matrix.shard.name }}
          path: "**/TestResults/"
          retention-days: 7

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: coverage-${{ matrix.shard.name }}
          path: "**/coverage.opencover.xml"
          retention-days: 7

  # ---------------------------------------------------------------------------
  # INTEGRATION TESTS (needs Docker service container)
  # ---------------------------------------------------------------------------
  integration-test:
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: granit_test
          POSTGRES_USER: granit_test
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U granit_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: granit_test
      POSTGRES_USER: granit_test
      POSTGRES_PASSWORD: test_password
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: NuGet cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build
        run: dotnet build -c $CONFIGURATION -p:RunAnalyzers=false -p:EnforceCodeStyleInBuild=false

      - name: Run integration tests
        run: |
          for proj in tests/*.Tests.Integration/*.Tests.Integration.csproj; do
            [ -f "$proj" ] && dotnet test "$proj" -c $CONFIGURATION --no-build \
              --logger "trx;LogFilePath=TestResults/results.trx" \
              --collect:"XPlat Code Coverage" \
              -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover,cobertura
          done

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: integration-test-results
          path: "**/TestResults/"
          retention-days: 7

  # ---------------------------------------------------------------------------
  # SECURITY (parallel, no build needed except CodeQL)
  # ---------------------------------------------------------------------------
  secret-detection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION=8.30.0
          curl --proto '=https' -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Gitleaks scan
        run: gitleaks detect --source . --verbose --log-opts="--all"

  trivy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          exit-code: 1
          format: table

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@c10b8064de6f491fea524254123dbe5e09572f13 # v4
        with:
          languages: csharp

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build for CodeQL
        run: dotnet build -c $CONFIGURATION -p:SkipIntegrationTests=true

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@c10b8064de6f491fea524254123dbe5e09572f13 # v4

  # ---------------------------------------------------------------------------
  # ANALYSIS
  # ---------------------------------------------------------------------------
  sonarcloud:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Java (SonarScanner)
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: 17

      - name: NuGet cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: SonarCloud cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}

      - name: Download coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Install SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: SonarCloud scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"granit-fx_granit-dotnet" \
            /o:"granit-fx" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="${SONAR_TOKEN}" \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" \
            /d:sonar.exclusions=".nuget/**,docs-site/**,scripts/**" \
            /d:sonar.coverage.exclusions="**/Tests/**,**/test/**,**/bundles/**,**/*HostApplicationBuilderExtensions.cs,**/Granit*Module.cs" \
            /d:sonar.issue.ignore.multicriteria="e1,e2,e3,e4" \
            /d:sonar.issue.ignore.multicriteria.e1.ruleKey="csharpsquid:S6608" \
            /d:sonar.issue.ignore.multicriteria.e1.resourceKey="**/*" \
            /d:sonar.issue.ignore.multicriteria.e2.ruleKey="external_roslyn:IDE0007" \
            /d:sonar.issue.ignore.multicriteria.e2.resourceKey="**/*" \
            /d:sonar.issue.ignore.multicriteria.e3.ruleKey="csharpsquid:S2699" \
            /d:sonar.issue.ignore.multicriteria.e3.resourceKey="**/Tests/**" \
            /d:sonar.issue.ignore.multicriteria.e4.ruleKey="csharpsquid:S3329" \
            /d:sonar.issue.ignore.multicriteria.e4.resourceKey="**/AesCacheValueEncryptor.cs" \
            /d:sonar.python.version="3.12" \
            /d:sonar.qualitygate.wait="true"
          dotnet build -c $CONFIGURATION
          dotnet sonarscanner end /d:sonar.token="${SONAR_TOKEN}"

  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: NuGet cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Check vulnerable packages
        run: |
          dotnet restore
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerability-report.txt
          ! grep -q "has the following vulnerable packages" vulnerability-report.txt

      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: vulnerability-report
          path: vulnerability-report.txt
          retention-days: 7

  # ---------------------------------------------------------------------------
  # PACK
  # ---------------------------------------------------------------------------
  pack:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write      # required for SLSA provenance attestation
      attestations: write  # required for SLSA provenance attestation
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: NuGet cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.1.0-dev.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: dotnet build -c $CONFIGURATION

      - name: Pack
        run: dotnet pack -c $CONFIGURATION --no-build -p:PackageVersion=${{ steps.version.outputs.version }} -o ./nupkgs

      - name: Upload packages
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: nupkgs
          path: nupkgs/
          retention-days: 7

      - name: Attest build provenance (SLSA Level 2)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: nupkgs/*.nupkg

  # ---------------------------------------------------------------------------
  # PUBLISH
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # SBOM — CycloneDX JSON, uploaded as artifact and attached to GitHub releases
  # ---------------------------------------------------------------------------
  sbom:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write  # read for checkout, write for release asset upload
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: NuGet cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install CycloneDX
        run: dotnet tool install --global CycloneDX

      - name: Generate SBOM
        run: dotnet CycloneDX Granit.slnx -o ./sbom --json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: sbom
          path: sbom/bom.json
          retention-days: 90

      - name: Attach SBOM to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} sbom/bom.json --clobber

  # GitHub Packages — dev packages on develop/main
  # sbom is kept in needs for ordering on main, but skipped on develop.
  # The if condition uses always() so the job runs even when sbom is skipped.
  publish-github:
    needs: [pack, sbom]
    runs-on: ubuntu-latest
    if: |
      always()
      && needs.pack.result == 'success'
      && (needs.sbom.result == 'success' || needs.sbom.result == 'skipped')
      && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    permissions:
      packages: write
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: nupkgs
          path: nupkgs

      - name: Push to GitHub Packages
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          dotnet nuget push "nupkgs/*.nupkg"
          --source "https://nuget.pkg.github.com/granit-fx/index.json"
          --api-key "$NUGET_AUTH_TOKEN"
          --skip-duplicate

  # nuget.org — release packages on version tags
  publish-nuget:
    needs: [pack, sbom]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: nuget-publish
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: nupkgs
          path: nupkgs

      - name: Push to nuget.org
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_API_KEY }}
        run: >
          dotnet nuget push "nupkgs/*.nupkg"
          --source "https://api.nuget.org/v3/index.json"
          --api-key "$NUGET_AUTH_TOKEN"
          --skip-duplicate

  # ---------------------------------------------------------------------------
  # CODE INDEX: validate that .mcp-code-index.json is up to date.
  # The file is generated locally via pre-commit hook and committed with code.
  # This job fails the CI if someone forgot to regenerate after changing sources.
  # ---------------------------------------------------------------------------
  code-index:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Regenerate .mcp-code-index.json
        run: python3 scripts/generate-code-index.py

      - name: Check for drift
        run: |
          if ! git diff --quiet .mcp-code-index.json; then
            echo "::error::.mcp-code-index.json is out of date. Run 'python3 scripts/generate-code-index.py' and commit."
            git diff .mcp-code-index.json
            exit 1
          fi

  shard-filters:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Regenerate shard filters
        run: python3 scripts/generate-shard-filters.py

      - name: Check for drift
        run: |
          if ! git diff --quiet .github/shard-filters/; then
            echo "::error::Shard filters are out of date. Run 'python3 scripts/generate-shard-filters.py' and commit."
            git diff .github/shard-filters/
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # DOCS: build & deploy handled by Cloudflare Pages (Git integration).
  # See CF Dashboard > Pages > granit-docs > Settings > Builds & deployments.
  # ---------------------------------------------------------------------------
