# =============================================================================
# GitHub Actions CI/CD - Granit
# =============================================================================
# Pipeline: build+test → security → analysis → pack → publish → deploy
#
# Each job builds independently from NuGet cache (~10s restore).
# No artifact sharing for bin/obj — avoids 750 MB upload/download overhead.
#
# Required secrets:
#   NUGET_API_KEY       — nuget.org API key (for publish on tag)
#
# Optional secrets:
#   SONAR_TOKEN         — SonarCloud authentication token
# =============================================================================

name: CI

on:
  push:
    branches: [develop, main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default all permissions to read — each job declares write only where needed.
# Required by OpenSSF Scorecard: Token-Permissions check.
permissions: read-all

env:
  DOTNET_VERSION: "10.0.x"
  CONFIGURATION: Release
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # ---------------------------------------------------------------------------
  # BUILD + FORMAT CHECK (shared gate — fails fast before tests)
  # ---------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: NuGet cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build (src only)
        run: >
          dotnet build .github/shard-filters/src-only.slnf
          -c $CONFIGURATION -m:4

      - name: Check formatting (src only)
        run: dotnet format .github/shard-filters/src-only.slnf --verify-no-changes --no-restore

  # ---------------------------------------------------------------------------
  # UNIT + INTEGRATION TESTS — parallel shards aligned with architecture layers,
  # plus a dedicated `integration` shard that owns every *.Tests.Integration project
  # (Postgres / Testcontainers — the dominant cost driver).
  # Shard definitions: .github/test-shards.json
  # Solution filters: .github/shard-filters/*.slnf (auto-generated)
  # ---------------------------------------------------------------------------
  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: core-ai
            label: "Core + AI"
          - name: application
            label: "Application Layer"
          - name: api-data
            label: "API & Http + Data"
          - name: infrastructure
            label: "Infrastructure"
          - name: security
            label: "Security & Compliance"
          - name: integration
            label: "Integration Tests"
          - name: architecture
            label: "Architecture Tests"
    name: test (${{ matrix.shard.label }})
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: NuGet cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build shard
        run: >
          dotnet build .github/shard-filters/${{ matrix.shard.name }}.slnf
          -c $CONFIGURATION -m:4
          -p:RunAnalyzers=false
          -p:EnforceCodeStyleInBuild=false

      - name: Run unit tests
        run: >
          dotnet test .github/shard-filters/${{ matrix.shard.name }}.slnf
          -c $CONFIGURATION --no-build
          --logger "trx;LogFilePath=TestResults/results.trx"
          --collect:"XPlat Code Coverage"
          -- RunConfiguration.MaxCpuCount=4
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover,cobertura

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results-${{ matrix.shard.name }}
          path: "**/TestResults/"
          retention-days: 7

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-${{ matrix.shard.name }}
          path: "**/coverage.opencover.xml"
          retention-days: 7

  # ---------------------------------------------------------------------------
  # SECURITY (parallel, no build needed except CodeQL)
  # ---------------------------------------------------------------------------
  secret-detection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION=8.30.0
          curl --proto '=https' -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Gitleaks scan
        run: gitleaks detect --source . --verbose --log-opts="--all"

  trivy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          exit-code: 1
          format: table
          # Resolved NuGet versions are read from packages.lock.json, which is
          # authoritative. Skip *.csproj and Directory.Packages.props to silence
          # "malformed version: 1.*" warnings on floating central-package ranges.
          skip-files: "**/*.csproj,**/Directory.Packages.props"

  # NuGet audit feed: complements Trivy (different CVE source, also catches
  # transitive dependencies disclosed AFTER lockfile generation).
  # Sharded the same way as build/test — restoring + auditing the full solution
  # (~295 projects) on a single runner exceeded the 5-minute budget.
  # `dotnet list package --vulnerable --include-transitive` is bottlenecked by
  # NuGet's vulnerability API: the architecture/security/infrastructure shards
  # already trend toward 7–8 min as the framework grows, so a 10-min cap leaves
  # no slack for NuGet latency spikes. 15 min keeps the job snappy on a green
  # day while absorbing the worst observed runs.
  dotnet-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [core-ai, application, api-data, infrastructure, security, integration, architecture]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: NuGet cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore (locked mode)
        run: dotnet restore .github/shard-filters/${{ matrix.shard }}.slnf --locked-mode

      - name: List vulnerable packages (transitive)
        run: |
          dotnet list .github/shard-filters/${{ matrix.shard }}.slnf package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -E "^\s*>\s.*(High|Critical)" vuln.txt; then
            echo "::error::High or Critical vulnerable NuGet packages detected in shard ${{ matrix.shard }}."
            exit 1
          fi

  # CodeQL runs in its own workflow (.github/workflows/codeql.yml) on a weekly
  # schedule + post-merge push, not on every PR — the suite is too slow (~10-20
  # min) for per-PR feedback and security queries evolve weekly, not per-commit.

  # ---------------------------------------------------------------------------
  # ANALYSIS
  # ---------------------------------------------------------------------------
  sonarcloud:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Java (SonarScanner)
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: 17

      - name: NuGet cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: SonarCloud cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}

      - name: Download coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Install SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: SonarCloud scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"granit-fx_granit-dotnet" \
            /o:"granit-fx" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="${SONAR_TOKEN}" \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" \
            /d:sonar.exclusions=".nuget/**,scripts/**" \
            /d:sonar.coverage.exclusions="**/Tests/**,**/test/**,**/bundles/**,**/*HostApplicationBuilderExtensions.cs,**/Granit*Module.cs" \
            /d:sonar.issue.ignore.multicriteria="e1,e2,e3,e4" \
            /d:sonar.issue.ignore.multicriteria.e1.ruleKey="csharpsquid:S6608" \
            /d:sonar.issue.ignore.multicriteria.e1.resourceKey="**/*" \
            /d:sonar.issue.ignore.multicriteria.e2.ruleKey="external_roslyn:IDE0007" \
            /d:sonar.issue.ignore.multicriteria.e2.resourceKey="**/*" \
            /d:sonar.issue.ignore.multicriteria.e3.ruleKey="csharpsquid:S2699" \
            /d:sonar.issue.ignore.multicriteria.e3.resourceKey="**/Tests/**" \
            /d:sonar.issue.ignore.multicriteria.e4.ruleKey="csharpsquid:S3329" \
            /d:sonar.issue.ignore.multicriteria.e4.resourceKey="**/AesCacheValueEncryptor.cs" \
            /d:sonar.python.version="3.12" \
            /d:sonar.qualitygate.wait="true"
          dotnet build -c $CONFIGURATION
          dotnet sonarscanner end /d:sonar.token="${SONAR_TOKEN}"

  # ---------------------------------------------------------------------------
  # PACK
  # ---------------------------------------------------------------------------
  pack:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write      # required for SLSA provenance attestation
      attestations: write  # required for SLSA provenance attestation
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: NuGet cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.1.0-dev.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: dotnet build -c $CONFIGURATION

      - name: Pack
        run: dotnet pack -c $CONFIGURATION --no-build -p:PackageVersion=${{ steps.version.outputs.version }} -o ./nupkgs

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nupkgs
          path: nupkgs/
          retention-days: 7

      - name: Attest build provenance (SLSA Level 2)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: nupkgs/*.nupkg

  # ---------------------------------------------------------------------------
  # PUBLISH
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # SBOM — CycloneDX JSON, uploaded as artifact and attached to GitHub releases
  # ---------------------------------------------------------------------------
  sbom:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write  # read for checkout, write for release asset upload
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: NuGet cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install CycloneDX
        run: dotnet tool install --global CycloneDX

      - name: Generate SBOM
        run: dotnet CycloneDX Granit.slnx -o ./sbom --json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom
          path: sbom/bom.json
          retention-days: 90

      - name: Attach SBOM to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} sbom/bom.json --clobber

  # GitHub Packages — dev packages on develop/main
  # sbom is kept in needs for ordering on main, but skipped on develop.
  # The if condition uses always() so the job runs even when sbom is skipped.
  # TEMP: GitHub Packages publish disabled — using GitLab Package Registry only.
  # publish-github:
  #   needs: [pack, sbom]
  #   runs-on: ubuntu-latest
  #   if: |
  #     always()
  #     && needs.pack.result == 'success'
  #     && (needs.sbom.result == 'success' || needs.sbom.result == 'skipped')
  #     && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
  #   permissions:
  #     packages: write
  #   steps:
  #     - name: Setup .NET
  #       uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
  #       with:
  #         dotnet-version: ${{ env.DOTNET_VERSION }}
  #
  #     - name: Download packages
  #       uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
  #       with:
  #         name: nupkgs
  #         path: nupkgs
  #
  #     - name: Push to GitHub Packages
  #       env:
  #         NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  #       run: >
  #         dotnet nuget push "nupkgs/*.nupkg"
  #         --source "https://nuget.pkg.github.com/granit-fx/index.json"
  #         --api-key "$NUGET_AUTH_TOKEN"
  #         --skip-duplicate

  # GitLab Package Registry (granit-business project, id 11) — fallback feed
  # for downstream repos when GitHub Packages is rate-limited or unavailable.
  # Uses a deploy token (write_package_registry scope) to avoid PAT churn.
  publish-gitlab:
    needs: [pack, sbom]
    runs-on: ubuntu-latest
    if: |
      always()
      && needs.pack.result == 'success'
      && (needs.sbom.result == 'success' || needs.sbom.result == 'skipped')
      && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: nupkgs
          path: nupkgs

      - name: Push to GitLab Package Registry
        # Credentials provided via NuGetPackageSourceCredentials_* env var rather
        # than `dotnet nuget add source --store-password-in-clear-text`, which
        # would write the deploy token to nuget.config on disk.
        env:
          NuGetPackageSourceCredentials_gitlab_granit_business: Username=${{ secrets.GITLAB_NUGET_USER }};Password=${{ secrets.GITLAB_NUGET_TOKEN }}
          GITLAB_NUGET_TOKEN: ${{ secrets.GITLAB_NUGET_TOKEN }}
        run: |
          dotnet nuget add source \
            "https://gitlab.digitaldynamics.be/api/v4/projects/11/packages/nuget/index.json" \
            --name gitlab_granit_business
          dotnet nuget push "nupkgs/*.nupkg" \
            --source gitlab_granit_business \
            --api-key "$GITLAB_NUGET_TOKEN" \
            --skip-duplicate

  # nuget.org — release packages on version tags
  publish-nuget:
    needs: [pack, sbom]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: nuget-publish
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: nupkgs
          path: nupkgs

      - name: Push to nuget.org
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_API_KEY }}
        run: >
          dotnet nuget push "nupkgs/*.nupkg"
          --source "https://api.nuget.org/v3/index.json"
          --api-key "$NUGET_AUTH_TOKEN"
          --skip-duplicate

  # ---------------------------------------------------------------------------
  # CODE INDEX: validate that .mcp-code-index.json is up to date.
  # The file is generated locally via pre-commit hook and committed with code.
  # This job fails the CI if someone forgot to regenerate after changing sources.
  # ---------------------------------------------------------------------------
  code-index:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Regenerate .mcp-code-index.json
        run: python3 scripts/generate-code-index.py

      - name: Check for drift
        run: |
          if ! git diff --quiet .mcp-code-index.json; then
            echo "::error::.mcp-code-index.json is out of date. Run 'python3 scripts/generate-code-index.py' and commit."
            git diff .mcp-code-index.json
            exit 1
          fi

  shard-filters:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Regenerate shard filters
        run: python3 scripts/generate-shard-filters.py

      - name: Check for drift
        run: |
          if ! git diff --quiet .github/shard-filters/; then
            echo "::error::Shard filters are out of date. Run 'python3 scripts/generate-shard-filters.py' and commit."
            git diff .github/shard-filters/
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # DOCS: build & deploy handled by Cloudflare Pages (Git integration).
  # See CF Dashboard > Pages > granit-docs > Settings > Builds & deployments.
  # ---------------------------------------------------------------------------
