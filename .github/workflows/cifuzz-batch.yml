name: Fuzz (nightly)

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: queryengine
            project: fuzz/Granit.QueryEngine.Fuzz
            assemblies: >-
              Granit.QueryEngine.AspNetCore.dll
              Granit.QueryEngine.Abstractions.dll
          - name: csv
            project: fuzz/Granit.DataExchange.Csv.Fuzz
            assemblies: >-
              Granit.DataExchange.Csv.dll
              Sep.dll
          - name: excel
            project: fuzz/Granit.DataExchange.Excel.Fuzz
            assemblies: >-
              Granit.DataExchange.Excel.dll
              Sylvan.Data.Excel.dll
          - name: queryengine-ai
            project: fuzz/Granit.QueryEngine.AI.Fuzz
            assemblies: >-
              Granit.QueryEngine.AI.dll
              Granit.QueryEngine.Abstractions.dll
    env:
      FUZZ_SECONDS: 3600
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install AFL++
        run: |
          sudo apt-get update
          sudo apt-get install -y afl++

      - name: Install SharpFuzz CLI
        run: dotnet tool install --global SharpFuzz.CommandLine

      - name: Publish harness
        run: dotnet publish ${{ matrix.target.project }} -c Release -o fuzz/out

      - name: Instrument assemblies
        run: |
          for asm in ${{ matrix.target.assemblies }}; do
            if [ -f "fuzz/out/$asm" ]; then
              sharpfuzz "fuzz/out/$asm"
            else
              echo "::warning::Assembly $asm not present in publish output — skipping instrumentation."
            fi
          done

      - name: Run AFL++
        env:
          AFL_SKIP_CPUFREQ: '1'
          AFL_NO_AFFINITY: '1'
          AFL_FAST_CAL: '1'
        run: |
          mkdir -p fuzz/findings
          harness_dll=$(basename "${{ matrix.target.project }}").dll
          timeout --preserve-status --signal=INT $((FUZZ_SECONDS + 30)) \
            afl-fuzz -V "$FUZZ_SECONDS" \
              -i "${{ matrix.target.project }}/seeds" \
              -o fuzz/findings \
              -- dotnet "fuzz/out/$harness_dll" || true

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-findings-nightly-${{ matrix.target.name }}
          path: fuzz/findings/
          retention-days: 14
          if-no-files-found: ignore

      - name: Fail on crashes
        run: |
          shopt -s nullglob
          crashes=(fuzz/findings/default/crashes/id:*)
          if [ ${#crashes[@]} -gt 0 ]; then
            echo "::error::AFL++ found ${#crashes[@]} crash(es) in shard ${{ matrix.target.name }} — see uploaded fuzz-findings-nightly-${{ matrix.target.name }} artifact."
            exit 1
          fi
          echo "No crashes in ${FUZZ_SECONDS}s for shard ${{ matrix.target.name }}."
